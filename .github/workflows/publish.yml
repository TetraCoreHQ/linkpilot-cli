name: Publish to npm

# Publishing runs HERE rather than from anyone's laptop, for two reasons:
#
#   1. npm provenance. A package published from a GitHub Actions workflow
#      carries a signed attestation linking the tarball to this repository and
#      this commit. Anyone can verify where the code came from, which matters
#      for a package whose whole job is handling secrets.
#   2. There is NO stored credential. Publishing authenticates with OIDC
#      trusted publishing: npm verifies this repository and workflow and
#      mints a short-lived token per run. Nothing to leak and nothing to
#      rotate.
#
# TO SET UP (one time, per PACKAGE -- npm configures this per package,
# not per repository):
#   npmjs.com -> the package -> Settings -> Trusted publishing
#     Organization: TetraCoreHQ
#     Repository:   linkpilot-cli
#     Workflow:     publish.yml
#     Environment:  (blank)
#     TICK "Allow npm publish".
#
#   THE TICKBOX IS NOT OPTIONAL. `npm stage publish` is always allowed;
#   `npm publish`, which this workflow runs, is not. Without it the
#   publish fails with a 404 -- npm returns 404 rather than 401 so it
#   does not leak whether a package exists, which makes an
#   authorisation problem look like a missing package. That cost three
#   failed runs to work out.
#
#   Packages published from here: @uselinkpilot/sdk, linkpilot
#
#   A package must EXIST before a trusted publisher can be configured
#   for it, so the very first publish of a NEW package still needs a
#   granular token. Delete the secret and revoke the token immediately
#   afterwards.
#
# TO RELEASE:
#   - bump the version in both package.json files
#   - git tag v0.1.0 && git push --tags
#   - or run this workflow manually with a dry run first

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing is OIDC, and OIDC needs npm >= 11.5.1. Node 22
      # bundles npm 10.x, which silently does not do it.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          # PINNED, not @latest. Trusted publishing needs npm >= 11.5.1,
          # and tracking latest means the release toolchain changes with
          # no commit -- which has already cost two failed runs here.
          npm install -g npm@11
          echo "npm $(npm -v) on node $(node -v)"

      - run: npm ci
      # BUILD BEFORE TYPECHECK. The CLI imports @uselinkpilot/sdk, whose types
      # come from its build output. On a clean checkout there is no dist/, so
      # typechecking first fails to resolve the module and then cascades into
      # a dozen "implicitly any" errors that look like real type problems and
      # are not. This passed locally only because a previous build had left
      # dist/ lying around.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # Fail before publishing rather than shipping a broken tarball: the
      # files list is easy to get wrong, and an SDK missing its dist is a
      # package that installs and then cannot be imported.
      - name: Check the tarballs contain what they claim
        run: |
          set -euo pipefail
          for pkg in packages/sdk packages/cli; do
            echo "--- $pkg"
            # Pack for real and read the archive. The --json shape is
            # npm's to change, and it did; a tarball listing is not.
            (cd "$pkg" && npm pack --silent --pack-destination "$RUNNER_TEMP" >/dev/null)
            tgz=$(ls -t "$RUNNER_TEMP"/*.tgz | head -1)
            files=$(tar -tzf "$tgz" | sed "s|^package/||" | grep -v "/$")
            rm -f "$tgz"
            echo "$files"
            echo "$files" | grep -q 'dist/index.js\|dist/bin.js' || { echo 'MISSING BUILD OUTPUT'; exit 1; }
            echo "$files" | grep -q 'README.md' || { echo 'MISSING README'; exit 1; }
            # A published package must never carry an actual credential FILE.
            #
            # Match on the BASENAME against known credential filenames, not a
            # substring of the whole path. The first version of this check
            # matched the word "credentials" anywhere and duly refused to
            # publish because the CLI ships dist/credentials.js — the module
            # that HANDLES credentials. A guard that blocks every release is
            # not a guard, it is an outage.
            offenders=$(echo "$files" | while read -r f; do
              base=$(basename "$f")
              case "$base" in
                .env|.env.*|.npmrc|.netrc|id_rsa|id_ed25519|*.pem|*.p12|*.pfx|*.keystore)
                  echo "$f" ;;
              esac
            done)
            if [ -n "$offenders" ]; then
              echo "REFUSING: tarball contains credential files:"; echo "$offenders"; exit 1
            fi
          done

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          # Publish one package, treating "this version is already on the
          # registry" as done rather than as a failure, so a partial release
          # can be finished by re-running instead of by bumping the version.
          publish_one() {
            local pkg="$1"; shift
            local name version
            name=$(node -p "require('./$pkg/package.json').name" 2>/dev/null || node -p "require('./package.json').name")
            version=$(node -p "require('./$pkg/package.json').version" 2>/dev/null || node -p "require('./package.json').version")

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "SKIP  $name@$version is already published"
              return 0
            fi

            echo "PUBLISH  $name@$version"
            npm publish "$@" --access public --provenance
          }

          publish_one packages/sdk -w @uselinkpilot/sdk
          publish_one packages/cli -w linkpilot

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: echo "Dry run only. Nothing was published."
