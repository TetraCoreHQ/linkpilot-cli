name: Set package access

# One-shot maintenance. The first publish of @uselinkpilot/sdk reported
# success but the package was not publicly readable: the registry returned 404
# to anonymous requests, which also broke `npm install linkpilot`, since the
# CLI depends on it.
#
# `--access public` on the publish did not take effect for the scoped package.
# This sets it explicitly. Safe to re-run; it is idempotent.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to make public"
        required: true
        default: "@uselinkpilot/sdk"

permissions:
  contents: read

jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Show current access
        run: npm access get status "${{ inputs.package }}" || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Set public
        run: npm access set status=public "${{ inputs.package }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Confirm
        run: npm access get status "${{ inputs.package }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
